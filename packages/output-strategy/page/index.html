<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>输出策略</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="shell">
    <header class="intro">
      <div class="intro-copy">
        <h1>输出策略</h1>
        <p class="lede">把选中的写作规则注入模型请求。可自由组合，全部默认关闭。</p>
      </div>
      <div class="intro-side">
        <div class="lang-row"></div>
        <p class="selection-count" aria-live="polite">
          <strong id="selectedCount">0 / 7</strong>
          <span>已选择</span>
        </p>
      </div>
    </header>

    <div class="workspace">
      <section class="styles-section" aria-labelledby="stylesTitle">
        <div class="section-heading">
          <h2 id="stylesTitle">样式组合</h2>
          <p id="catalogState">正在读取目录…</p>
        </div>

        <form id="stylesForm">
          <fieldset id="stylesFieldset" disabled>
            <legend class="sr-only">选择要注入的输出样式</legend>
            <div id="stylesList" class="styles-list"></div>
          </fieldset>
          <div class="form-footer">
            <p id="formMessage" class="form-message" role="status" aria-live="polite">正在读取设置…</p>
            <button id="saveButton" type="submit" disabled>保存更改</button>
          </div>
        </form>
        <noscript><p class="inline-error">需要启用 JavaScript 才能更改样式。</p></noscript>
      </section>

      <aside class="stats-section" aria-labelledby="statsTitle">
        <div class="section-heading">
          <h2 id="statsTitle">本地统计</h2>
          <p id="statsState">只计数，不保存请求或回答内容。</p>
        </div>
        <dl class="totals">
          <div><dt>requests</dt><dd id="statRequests">—</dd></div>
          <div><dt>applied</dt><dd id="statApplied">—</dd></div>
          <div><dt>skipped</dt><dd id="statSkipped">—</dd></div>
          <div><dt>injectedBytes</dt><dd id="statInjectedBytes">—</dd></div>
        </dl>
        <h3>各样式次数</h3>
        <ul id="styleStats" class="style-stats"></ul>
      </aside>
    </div>
  </main>

  <script src="_magpie/bridge.js"></script>
  <script src="catalog.js"></script>
  <script src="stats.js"></script>
  <script src="i18n.js"></script>
  <script src="app.js" defer></script>
</body>
</html>

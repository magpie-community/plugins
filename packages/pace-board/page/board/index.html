<!doctype html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- 口令由服务端在发这份 HTML 时填进来；文件里留空，别写死。 -->
    <meta name="pace-token" content="" />
    <title>AI_额度节奏盘</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="app">
      <header class="top">
        <div class="top-main">
          <h1>AI_额度节奏盘</h1>
          <p class="sub" id="sub">正在读取…</p>
          <p class="refresh-note" id="refreshNote"></p>
        </div>
        <div class="top-side">
          <button id="refreshBtn" class="icon-btn" type="button" title="立即刷新额度" aria-label="立即刷新额度">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M20 11a8 8 0 1 0-2.3 5.7" />
              <path d="M20 4v7h-7" />
            </svg>
          </button>
          <label class="auto-wrap">
            <span>自动刷新</span>
            <select id="autoRefresh" class="auto-select">
              <option value="0">关闭</option>
              <option value="5000">5 秒</option>
              <option value="10000">10 秒</option>
              <option value="30000">30 秒</option>
              <option value="60000">1 分钟</option>
              <option value="300000" selected>5 分钟</option>
              <option value="900000">15 分钟</option>
              <option value="1800000">30 分钟</option>
            </select>
          </label>
        </div>
      </header>

      <section class="formula" id="formula" hidden>
        <div class="formula-line">
          <span class="mono">pace = (100 − 已用%) ÷ max(距到期小时, 1)</span>
          <span class="hint">分子是剩余百分比，分母是还能撑多久。越快到期、剩得越多，越该先用。</span>
        </div>
        <div class="nextup" id="nextup"></div>
      </section>

      <div id="warnings" class="warnings"></div>

      <nav class="tabs" id="tabs">
        <button class="tab is-on" data-tab="rank" type="button">排名 <span class="pill" id="cRank">0</span></button>
        <button class="tab" data-tab="waste" type="button">到期账 <span class="pill" id="cWaste">0</span></button>
        <button class="tab" data-tab="all" type="button">全部账号 <span class="pill" id="cAll">0</span></button>
      </nav>

      <main id="panels">
        <section class="panel is-on" id="panel-rank"></section>
        <section class="panel" id="panel-waste"></section>
        <section class="panel" id="panel-all"></section>
      </main>

      <footer class="foot" id="foot"></footer>
    </div>
    <script src="app.js"></script>
  </body>
</html>

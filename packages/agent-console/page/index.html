<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Console</title>
<style>
  :root { color-scheme: light dark; }
  html, body { margin: 0; height: 100%; }
  body {
    display: grid; place-items: center;
    font: 13px/1.5 var(--magpie-font, -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif);
    background: var(--magpie-bg, Canvas); color: var(--magpie-fg, CanvasText);
  }
  .box { text-align: center; color: var(--magpie-muted, GrayText); }
  .box b { display: block; color: var(--magpie-fg, CanvasText); font-size: 14px; margin-bottom: 4px; }
  .box button { margin-top: 12px; }
</style>
</head>
<body>
  <div class="box">
    <b>Agent Console</b>
    <span id="said">正在启动本地服务…</span>
    <div><button id="retry" type="button" hidden>Retry</button></div>
  </div>
  <script src="_magpie/bridge.js"></script>
  <!-- {port, key} written by the plugin host after it binds the gate port (the gate key, not the daemon token); boot.js retries if it doesn't exist -->
  <script src="session.js"></script>
  <script src="boot.js"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ShyPie protection</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="panel-page">
  <main class="panel-shell">
    <header class="panel-head">
      <div>
        <p class="kicker">ShyPie Filter</p>
        <h1 id="panel-title">Agent protection</h1>
        <p class="hint" id="panel-lede">Disabled agents bypass the gate entirely.</p>
      </div>
      <span class="count" id="panel-count"></span>
    </header>
    <div class="list" id="panel-list" aria-label="Agent protection"></div>
    <p class="hint" id="panel-patterns" hidden></p>
    <footer class="panel-actions">
      <span class="status" id="panel-status" role="status" aria-live="polite"></span>
      <button id="panel-save" type="button" disabled>Save</button>
    </footer>
  </main>
  <script src="_magpie/bridge.js"></script>
  <script src="agents.js"></script>
  <script src="policy.js"></script>
  <script src="panel.js" defer></script>
</body>
</html>

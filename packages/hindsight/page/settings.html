<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Hindsight Memory</title>
  <link rel="stylesheet" href="style.css">
  <script defer src="_magpie/bridge.js"></script>
  <script defer src="settings.js"></script>
</head>
<body>
  <main class="launcher">
    <h1>Hindsight Memory</h1>
    <p id="status" role="status">正在读取 Magpie 插件配置…</p>
    <button id="open" type="button" disabled>打开工作台</button>
    <details>
      <summary>工作台打不开</summary>
      <p>如果本地服务端口被占用，可以从这里更换。更换端口不影响网关召回。</p>
      <label for="port">本地服务端口</label>
      <input id="port" type="number" min="1024" max="65535" value="3482" required>
      <button id="save-port" type="button" class="secondary" disabled>保存端口并打开</button>
    </details>
  </main>
</body>
</html>

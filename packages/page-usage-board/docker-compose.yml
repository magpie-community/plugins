# Public deployment: the service is reachable only from this host's loopback,
# so put Caddy/nginx in front (TLS + auth) and proxy to 127.0.0.1:3456.
#
# Two modes:
#   A. Proxy handles auth (recommended): leave PAGE_KEY empty, set ALLOWED_HOSTS.
#   B. The app handles auth: set PAGE_KEY, open https://host/?key=... once and bookmark.
services:
  usage-board:
    build: .
    image: magpie-usage-board
    restart: unless-stopped
    ports:
      - "127.0.0.1:3456:3455"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      HOST: 0.0.0.0
      PORT: "3455"
      # The public name the proxy sends in Host. Required when PAGE_KEY is empty.
      ALLOWED_HOSTS: "${ALLOWED_HOSTS:-}"
      # Empty string = auth explicitly disabled; the proxy is the gate (Mode A).
      # Under compose the service will NOT auto-generate a key (the variable is always
      # defined here). For app auth (Mode B), put PAGE_KEY in .env.
      PAGE_KEY: "${PAGE_KEY:-}"
      PAGE_KEY_FILE: /data/page-key
      DATA_DIR: /data
      USAGE_JSONL: /magpie/usage.jsonl
      # magpie's gateway on the Docker host; the board still works without it for attribution.
      GATEWAY: "http://host.docker.internal:3425"
      MAGPIE_KEY: "${MAGPIE_KEY:-}"
    volumes:
      - usage-data:/data
      # magpie's config directory, read-only (usage.jsonl lives here).
      - "${MAGPIE_CONFIG:-./magpie-config}:/magpie:ro"

volumes:
  usage-data:

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>用量看板</title>
<!--
  带路页：把 magpie 的框架导航到看板服务。

  目标优先用 window.magpie.service —— 这是 magpie web 在自己域名下替插件服务转发的
  路径（package.json 的 magpie.page.service 声明了端口）。用它，页面始终留在 magpie
  的 origin 里，远程打开时由 magpie 自己的 key/auth 保护；桌面窗口没有 service，
  回退到本机 http://127.0.0.1:3455/。

  <meta refresh> 是兜底：脚本被 CSP 拦掉、或 bridge 握手卡住时，8 秒后仍能走本机。
  boot.js 只做一次跳转，不探测服务（页面 CSP 是 connect-src 'none'，探测必失败）。

  口令不在这里：服务端返回看板时把口令注入 window.__KEY__，只有 API 路由校验它。
  仓库、URL、书签里都不出现口令。
-->
<meta id="go" http-equiv="refresh" content="8;url=http://127.0.0.1:3455/">
<style>
  :root { color-scheme: light dark; }
  html, body { margin: 0; height: 100%; }
  body {
    display: grid; place-items: center;
    font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    background: Canvas; color: CanvasText;
  }
  .box { text-align: center; color: GrayText; }
  .box b { display: block; color: CanvasText; font-size: 14px; margin-bottom: 10px; }
  .bar { width: 200px; height: 3px; border-radius: 2px; background: rgba(128,128,128,.25); background: color-mix(in srgb, CanvasText 14%, transparent); overflow: hidden; margin: 0 auto 8px; }
  .bar i { display: block; height: 100%; width: 12%; border-radius: 2px; background: #4da3ff; background: AccentColor; transition: width .4s ease; }
  .bar.bad i { background: #f85149; }
  .box span { display: block; font-size: 11.5px; min-height: 2.4em; }
  .box span.bad { color: #f85149; }
</style>
</head>
<body>
  <div class="box">
    <b>用量看板</b>
    <div class="bar"><i id="bar"></i></div>
    <span id="msg">正在打开看板…</span>
  </div>
  <script src="_magpie/bridge.js"></script>
  <script src="boot.js"></script>
</body>
</html>

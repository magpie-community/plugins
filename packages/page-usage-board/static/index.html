// 主题在 CSS 生效前定稿（无闪变）：带路页从 magpie 桥接读到宿主的深浅色经 ?theme= 传来
//（magpie 自己的设置优先于系统）；没有参数时跟随 prefers-color-scheme。
(function () {
  var t = new URLSearchParams(location.search).get('theme');
  if (t !== 'dark' && t !== 'light') {
    t = window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
  }
  document.documentElement.dataset.theme = t;
})();

<style>
:root{
  --bg:#0e1116;--card:#161b22;--card2:#1c2330;--line:#2a3140;--txt:#d7dde6;--dim:#8b93a1;
  --acc:#4da3ff;--ok:#3fb950;--warn:#d29922;--bad:#f85149;
  --heat0:#161b22;--tipbg:#1c2330;--tipline:#2a3140;--tiptxt:#d7dde6;
  --lineh:#2c3547;--barbg:#232a36;--tdline:#1d2430;--trhov:#1a2130;
  --skelc1:rgba(255,255,255,.05);--skelc2:rgba(255,255,255,.13);--segused:rgba(255,255,255,.18);
  color-scheme:dark;
}
/* 浅色：data-theme 由上面的内联脚本定稿（?theme= 来自 magpie 桥接，否则跟随系统），
   图表颜色在渲染时经 cssVar() 读取这些变量 */
:root[data-theme="light"]{
  --bg:#f5f7fa;--card:#ffffff;--card2:#eef1f5;--line:#d5dae2;--txt:#24292f;--dim:#57606a;
  --heat0:#eaeef2;--tipbg:#ffffff;--tipline:#d5dae2;--tiptxt:#24292f;
  --lineh:#b9c2ce;--barbg:#e3e8ee;--tdline:#e3e8ee;--trhov:#f0f3f7;
  --skelc1:rgba(0,0,0,.05);--skelc2:rgba(0,0,0,.12);--segused:rgba(0,0,0,.15);
  color-scheme:light;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font:13px/1.55 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif;padding:16px 18px;-webkit-font-smoothing:antialiased}
.wrap{max-width:1280px;margin:0 auto}
h1{font-size:18px;font-weight:650;margin-bottom:2px}
.sub{color:var(--dim);font-size:11.5px;margin-bottom:14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
h2{font-size:13.5px;font-weight:650;margin:22px 0 10px;display:flex;align-items:center;gap:8px}
h2 .pill{font-size:11px;color:var(--dim);font-weight:400}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;min-width:0;box-shadow:0 10px 26px -16px rgba(0,0,0,.25)}
.card .hd{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.card img{width:18px;height:18px;border-radius:4px;flex:none}
.card .nm{font-weight:600;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .exp{margin-left:auto;font-size:11px;padding:1px 8px;border-radius:999px;background:var(--card2);color:var(--dim);white-space:nowrap}
.exp.d3{background:#3a1518;color:#ff7b72}.exp.d7{background:#3a2a10;color:#e3b341}.exp.d30{background:#123047;color:#79c0ff}
.win{margin-top:6px}
.win .row{display:flex;align-items:baseline;gap:6px;font-size:12.5px}
.win .wn{color:var(--dim);flex:none;max-width:110px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.win .wv{margin-left:auto;font-variant-numeric:tabular-nums;white-space:nowrap}
.win .disp{color:var(--dim);font-size:11.5px}
.bar{height:5px;border-radius:3px;background:var(--barbg);margin-top:3px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px;background:var(--acc);transition:width .5s}
.bar i.w{background:var(--warn)}.bar i.b{background:var(--bad)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:12px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.kpi .l{font-size:11px;color:var(--dim);letter-spacing:.02em}
.kpi .v{font-size:18px;font-weight:650;font-variant-numeric:tabular-nums;margin-top:2px;white-space:nowrap}
.kpi .s{font-size:11.5px;color:var(--dim);line-height:1.45;height:1.45em;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.kpi .s .roll{display:block;height:1.45em;line-height:1.45em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .s .roll span{display:block;height:1.45em;line-height:1.45em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:opacity .22s ease,transform .22s ease}
.charts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.chart{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;box-shadow:0 10px 26px -16px rgba(0,0,0,.25)}
.chart h3{font-size:13.5px;font-weight:650;margin:0 0 8px;color:var(--txt)}
.cbody{height:300px}
table{width:100%;border-collapse:collapse;font-size:12px;font-variant-numeric:tabular-nums}
th{color:var(--dim);text-align:left;font-weight:500;padding:5px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:5px 8px;border-bottom:1px solid var(--tdline);white-space:nowrap}
tr:hover td{background:var(--trhov)}
.st{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}
.st.ok{background:var(--ok)}.st.bad{background:var(--bad)}.st.retry{background:var(--warn)}
.tbtn{background:var(--card2);border:1px solid var(--line);color:var(--txt);border-radius:7px;padding:3px 12px;font-size:12px;cursor:pointer}
.tbtn.on{background:var(--acc);border-color:var(--acc);color:#06131f;font-weight:600}
.err{color:var(--bad);font-size:12px;padding:8px}
@media(max-width:900px){.charts{grid-template-columns:1fr}}
th.num,td.num{text-align:right}
.card .hd .pill{min-width:0;max-width:42%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#remoteAcctTable table{table-layout:fixed}
#remoteAcctTable th{position:sticky;top:0;background:var(--card);z-index:1}
#remoteAcctTable td{overflow:hidden;text-overflow:ellipsis}
#remoteAcctTable th:nth-child(2),#remoteAcctTable td:nth-child(2){width:36%}
.win .disp{display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
*{scrollbar-width:thin;scrollbar-color:var(--line) transparent}
/* 额度卡片 v2：圆形 logo 垂直居中 + 双行（快过期/总积分）+ 迷你进度条（方案B） */
.q2card{display:flex;gap:12px;align-items:center}
.q2logo{flex:0 0 auto;width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:17px;color:hsl(var(--h),70%,68%);background:hsl(var(--h),40%,20%);border:1px solid hsl(var(--h),35%,30%);position:relative}
.q2logo img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#fff;border-radius:50%}
.q2days{position:absolute;bottom:-3px;right:-6px;font-size:10px;font-style:normal;padding:1px 5px;border-radius:999px;color:#fff;background:#3d4553;border:1px solid #0e1116}
.q2days.d1{background:#f85149}
.q2days.d7{background:#e78c08}
.q2body{flex:1;min-width:0}
.q2head{display:flex;align-items:baseline;gap:8px;min-width:0}
.q2name{font-weight:600;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.q2user{color:var(--dim);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:0 1 auto;max-width:45%}
.q2row{display:flex;align-items:baseline;gap:8px;font-size:12.5px;margin-top:5px;min-width:0}
.q2label{color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:0 1 auto}
.q2val{font-weight:600;font-variant-numeric:tabular-nums}
.q2exp{margin-left:auto;color:var(--dim);font-size:11.5px;white-space:nowrap}
.q2exp.hot{color:#f85149;font-weight:600}
.q2exp.warm{color:#e78c08}
.q2bar{height:4px;border-radius:2px;background:rgba(255,255,255,.07);margin-top:3px;overflow:hidden}
.q2bar i{display:block;height:100%;border-radius:2px;background:#4da3ff}
.q2seg{display:flex;gap:1px}
.q2seg i{border-radius:0;min-width:0}
.q2err{color:#f85149;font-size:11.5px;margin-top:4px}
/* 美化层：骨架屏 / 空状态覆盖层 / 卡片 hover / 额度条入场 / reduced-motion */
.cbody{position:relative}
.cover{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--dim);font-size:12px;pointer-events:none}
.cover.skel{flex-direction:column;gap:9px}
.cover.skel i{display:block;height:9px;border-radius:5px;background:linear-gradient(90deg,var(--skelc1),var(--skelc2),var(--skelc1));background-size:200% 100%;animation:skel 1.3s linear infinite}
.cover.skel i:nth-child(1){width:58%}
.cover.skel i:nth-child(2){width:38%;animation-delay:.15s}
.cover.skel i:nth-child(3){width:48%;animation-delay:.3s}
@keyframes skel{from{background-position:200% 0}to{background-position:-200% 0}}
.kpi,.chart,.card{transition:border-color .16s ease,transform .16s ease,box-shadow .16s ease}
.kpi:hover,.chart:hover,.card:hover{border-color:var(--lineh);transform:translateY(-1px)}
.q2bar i{animation:barin .55s cubic-bezier(.22,.61,.36,1)}
@keyframes barin{from{width:0}}
@media (prefers-reduced-motion: reduce){
  .cover.skel i{animation:none}
  .q2bar i{animation:none}
  .bar i{transition:none}
  .kpi,.chart,.card{transition:none}
  .kpi .s .roll{transition:none}
}
/* 手机端额度卡：收起次要信息（账号名），数值过长省略，不再竖排堆叠 */
@media (max-width:640px){
  .q2user{display:none}
  .q2row{font-size:12px}
  .q2val{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:0 1 auto}
}
</style>

let remoteSeq = 0, remoteCtrl = null;
async function loadRemote() {
  // 归因统一走本机 /api/attribution：有 remote provider 时由本机 server 去问远端 magpie
  // 的 usage/requests（按 caller 过滤），没有则返回 source:"local"，远端卡片保持隐藏。
  // 竞态守卫：启动即 abort 上一次请求（最长 45 秒才超时），响应回来时若序号已过期
  // 则整体丢弃——旧区间的慢响应不得覆盖新视图（不渲染、不置 remoteFailed）。
  if (remoteCtrl) try { remoteCtrl.abort(); } catch {}
  const seq = ++remoteSeq;
  const ctrl = remoteCtrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(new Error(t('attrTimeout'))), 45000);
  try {
    const r = await fetch(auth('api/attribution?period=' + period), { signal: ctrl.signal, headers: hf() });
    if (seq !== remoteSeq) return; // 过期响应：直接丢弃
    if (!r.ok) {
      let msg = t('attrApiErr') + r.status;
      try { const j = await r.json(); if (j && j.error) msg = j.error; } catch {}
      throw new Error(msg);
    }
    const jd = await r.json();
    if (seq !== remoteSeq) return; // 过期响应：直接丢弃
    if (jd.source !== 'remote') {
      remoteFailed = true;
      hideRemoteCards();
      renderDaily(lastDetail || {}); renderProv(lastModels); renderFlow();
      return;
    }
    try { applyRemoteIcons(jd); renderRemote(jd); } catch (re) { console.error('[usage-board] renderRemote threw:', re); throw new Error('renderRemote: ' + re.message); }
  } catch (e) {
    if (seq !== remoteSeq) return; // 自己被新请求 abort：静默丢弃，不算失败
    remoteFailed = true; renderDaily(lastDetail || {}); renderProv(lastModels); // 真不可用：此刻才允许线路名兜底
    console.warn('[usage-board] attribution failed:', e && e.message || e);
    // 归因不可用时显示卡片+错误说明（而不是无声消失）
    const msg = t('remoteUnavail') + esc(String(e && e.message || e)) + t('remoteUnavailTail');
    const tw = document.getElementById("remoteTtftWrap");
    if (tw) {
      tw.style.display = "";
      const te = document.getElementById("remoteTtftErr");
      te.textContent = msg; te.style.display = "";
      document.getElementById("cRemoteTtft").style.display = "none";
    }
    const aw = document.getElementById("remoteAcctWrap");
    if (aw) {
      aw.style.display = "";
      const ae = document.getElementById("remoteAcctErr");
      ae.textContent = msg; ae.style.display = "";
      document.getElementById("remoteAcctTable").innerHTML = "";
    }
    const p = document.getElementById("remotePill");
    if (p) p.textContent = t('dataUnavail');
    renderFlow();
  } finally {
    clearTimeout(timer);
    if (remoteCtrl === ctrl) remoteCtrl = null;
  }
}

  if(w.amount!=null)return w.amount;
  if(w.used!=null&&w.limit!=null&&w.used<=100&&(w.remaining==null||w.remaining<=100))return w.limit*w.used/100;

function usedPct(w){
  if(/usd|美元|\$/i.test(w.unit||''))return null; // 美元是账单口径
  if(w.used==null||w.remaining!=null&&w.remaining>100)return null;
  if(w.remaining!=null&&w.remaining<=100&&Math.abs(100-w.used-w.remaining)>1)return null; // 不互补→used 另有含义
  if(w.used<0||w.used>100)return null;

function winRemain(w){
  if(w.runsOut!=null)return w.runsOut;
  if(w.limit&&w.amount!=null)return Math.max(0,w.limit-w.amount);
  // used 百分比 + 无 remaining：剩余 = limit×(100-used)/100（MonkeyCode 每日 Token 额度）。
  // 美元窗口排除：trae-global「Dollar Usage」used=0/limit=1 不是剩余 1 美元。
  if(!/usd|美元|\$/i.test(w.unit||'')&&w.limit&&w.used!=null&&w.remaining==null)return Math.max(0,w.limit*(100-w.used)/100);
  // 余额型窗口（magpie 0.1.3771 归一化形状：balance=剩余绝对量，无 limit）：
  // meoo/kuku 的「积分」「积分余额」。balance 就是剩余，不是总量。
  if(w.balance!=null)return Math.max(0,w.balance);
  // 无 balance 字段但 display 是「纯余额文本」（catpaw「1198.12 credit」）→ 数字即剩余。
  // 带「剩/已用/共」等前缀或「x / y」的不算（那是总量或已用口径，当剩余会虚高）。
  if(w.limit==null){
    const m=String(w.display||'').trim().match(/^([\d,.]+)\s*(?:credits?|积分|魔粒)?$/i);

function winAlive(w){

  if(w.limit&&w.amount!=null)return w.limit-w.amount>0;
  // used 百分比窗口（MonkeyCode）：used<100 即还有剩余
  if(w.limit&&w.used!=null&&w.remaining==null)return w.used<100;
  // 余额型窗口：balance>0 即活着
  if(w.balance!=null)return w.balance>0;

function quotaWins(q){

function soonWin(wins){

  const named=wins.filter(w=>/限时|临时/.test(w.name||'')&&winAlive(w));

}
// 总积分：优先用插件给的余额字段（“6800 积分”“248 魔粒可用”是聚合总量），
// 其次取积分类窗口的总额（limit，或 display 里「已用 / 总量」的后者）。
// 金额（$）不算积分；欠费表示可用为 0（“已欠费 1 积分” → 0，明细仍在首行显示）。
// magpie 宿主把 aside/text 窗口归一化成 {text:true, remaining:100, display:"N credits"}
// （结构被剥掉，只剩余额文本，remaining:100 无意义）——对这种窗口，display 的数字
// 是各池的【余额】而非总量：多池并存时总积分 = 各池余额之和（VPS 的 loomy 就是这种
// 形状：每日赠送 + 永久 两个 text 池），并把 allText 带回，让卡片标签写「积分余额」
// 而不是「总积分」——后者暗示一个真实上限，这里并不存在。
const fmtPts=n=>fmt(Number.isInteger(n)?n:Math.round(n*100)/100);
function pointTotal(q,wins){
  const b=String(q.balance||'').replace(/,/g,'');
  if(b&&!/[$¥]/.test(b)){
    const m=b.match(/\d+(?:\.\d+)?/);
    const n=m?(/欠费/.test(b)?0:+m[0]):null;
    if(n!=null){
      const u=/魔粒/.test(b)?t('unitMoli'):/credits/i.test(b)?'credits':/积分/.test(b)?t('unitPoints'):/points/i.test(b)?'points':'';
      return {n,u};
    }
  }
  // 先过一遍：有没有「纯余额文本」的积分类窗口（宿主归一化形状）
  const textWins=wins.filter(w=>w.text&&/积分|魔粒|credits|points/i.test((w.name||'')+' '+(w.unit||'')));
  if(textWins.length&&textWins.length===wins.filter(w=>/积分|魔粒|credits|points/i.test((w.name||'')+' '+(w.unit||''))).length){
    // 全部积分类窗口都是 text 形状 → 余额求和；0 也是合法余额（每日用尽 ≠ 没这个池）
    let sum=0,u='';
    for(const w of textWins){
      const v=dispNum(w);
      if(v==null)continue;
      sum+=v;
      if(!u)u=/魔粒/.test(w.name||'')?t('unitMoli'):/credits/i.test((w.unit||'')+(w.name||''))?'credits':t('unitPoints');
    }
    if(sum>0||textWins.some(w=>dispNum(w)===0))return {n:sum,u,allText:true};
  }
  let best=null;
  for(const w of wins){
    const nm=(w.name||'')+' '+(w.unit||'');
    if(!/积分|魔粒|credits|points/i.test(nm))continue;
    let tot=w.limit!=null?w.limit:null;
    if(tot==null){
      // display 里取「剩余 9.57 积分」「92 / 2200 credits」这类总量：先剔掉日期时间，再取最大值
      const disp=String(w.display||'').replace(/\d{4}-\d{2}-\d{2}|\d{1,2}-\d{1,2}|\d{1,2}:\d{2}/g,' ');
      const nums=(disp.match(/\d+(?:\.\d+)?/g)||[]).map(Number).filter(n=>n>0);
      if(nums.length)tot=Math.max(...nums);
    }
    if(tot==null||!(tot>0))continue;
    if(!best||tot>best.n)best={n:tot,u:/魔粒/.test(nm)?t('unitMoli'):/credits/i.test(nm)?'credits':t('unitPoints'),exp:winExp(w)};
  }
  return best;
}
function fmtDaysLeft(ts){
  // 用原始剩余时长判断，不用 ceil(天)：剩 6 小时不能显示「明天到期」，要和角标的「今天」一致
  const d=(ts-Date.now())/864e5;
  if(d<1)return t('expToday');
  if(d<2)return t('expTomorrow');
  if(d<=7)return t('voidInPre')+Math.ceil(d)+t('voidInSuf');
  return t('voidDatePre')+new Date(ts).toLocaleDateString(LANG==='zh'?'zh-CN':'en-US',{month:'2-digit',day:'2-digit'})+t('voidDateSuf');
}
// 到期由近到远：≤3 天红、≤7 天橙、≤14 天黄、更远绿（角标/进度条/右侧到期文字共用）
function expColor(d){return d<=3?'#f85149':d<=7?'#e78c08':d<=14?'#c9a227':'#3fb950';}
// 总积分构成：长期（不会作废的部分）+ 临时剩余 + 临时已用。
// 临时池只取「带到期时间、有剩余量」的那一个积分窗口（临期额度/总额度可能互为子集，不能相加），
// 长期 = 总积分 - 临时剩余；已用取自 amount，缺失时用 limit-剩余。
function dispNum(w){
  const cleaned=String(w.display||'').replace(/,/g,'').replace(/\d{4}-\d{2}-\d{2}|\d{1,2}-\d{1,2}|\d{1,2}:\d{2}/g,' ');
  const m=cleaned.match(/\d+(?:\.\d+)?/);
  return m?+m[0]:null;
}
function pointSplit(q,wins,tot){
  if(!tot)return null;
  // 插件给了显式命名池（麦吉：限时积分 / 永久积分）就直接按它拆，不去猜 runsOut
  let tempN=null,permN=null;
  for(const w of wins){
    const n=w.name||'';
    if(/限时|临时/.test(n)){const v=dispNum(w);if(v!=null&&v>0)tempN=v;}
    else if(/永久|长期/.test(n)){const v=dispNum(w);if(v!=null)permN=v;}
  }
  if(tempN!=null){
    const perm=permN!=null?permN:Math.max(0,tot.n-tempN);
    const sum=perm+tempN;
    if(sum>0)return {perm,tempR:tempN,used:0,sum};
  }
  let tw=null,t=Infinity;
  for(const w of wins){
    const nm=(w.name||'')+' '+(w.unit||'');
    if(!/积分|魔粒|credits|points/i.test(nm))continue;
    const e=winExp(w);let rem=winRemain(w);
    if(rem==null&&w.limit!=null&&w.remaining!=null)rem=w.limit*w.remaining/100;
    if(e==null||rem==null)continue;
    if(e<t){t=e;tw=w;}
  }
  if(!tw)return null;
  const tempR=Math.max(0,winRemain(tw)||0);
  // 临时剩余不可能超过总积分：个别插件把 token 池标成 credits（SenseNova 120000），量级对不上就不画
  if(tot.n>0&&tempR>tot.n*1.001)return null;
  const used=(()=>{const u=winUsed(tw);return u!=null?Math.max(0,u):(tw.limit!=null?Math.max(0,tw.limit-tempR):0);})();
  const perm=Math.max(0,tot.n-tempR);
  const sum=perm+tempR+used;
  return sum>0?{perm,tempR,used,sum}:null;
}
// 额度池的 可用/已用（无积分拆分时给主池画分段条用）；美元类额度不画
function poolSplit(w){
  if(!w||w.limit==null||/usd|美元|\$/i.test(w.unit||''))return null;
  let rem=winRemain(w);
  if(rem==null&&w.remaining!=null)rem=w.limit*w.remaining/100;
  if(rem==null)return null;
  rem=Math.max(0,rem);
  const used=(()=>{const u=winUsed(w);return u!=null?Math.max(0,u):Math.max(0,w.limit-rem);})();
  return {rem,used};
}
function segBar(name,rem,used){
  const all=rem+used;
  if(!(all>0))return '';
  const w1=(100*rem/all).toFixed(1),w2=(100*used/all).toFixed(1);
  return `<div class="q2bar q2seg" title="${esc(name)}${t('colonFull')}${t('avail')} ${fmt(rem)} · ${t('usedLbl')} ${fmt(used)}"><i style="width:${w1}%;background:#4da3ff"></i>${used>0?`<i style="width:${w2}%;background:var(--segused)"></i>`:''}</div>`;
}
function quotaCard(q){
  const wins=quotaWins(q);
  // 快过期行：积分窗口里到期最早的；第二行：总积分（余额字段 > 积分类窗口总量 > 原窗口行）
  const [expWin,expT]=soonWin(wins);
  const tot=pointTotal(q,wins);
  const sp=pointSplit(q,wins,tot);
  let totWin=tot?null:(wins.find(w=>/积分余额|总额度|余额/.test(w.name||'')&&w!==expWin)
    ||wins.filter(w=>w!==expWin).sort((a,b)=>(b.limit||0)-(a.limit||0))[0]);
  const nameStr=String(q.name||q.provider||'?');
  const hue=[...nameStr].reduce((s,c)=>(s*31+c.charCodeAt(0))>>>0,7)%360;
  const initial=[...nameStr].find(c=>c.trim())||'?';
  const days=expWin?(expT-Date.now()):null;
  const badge=days!=null?`<i class="q2days" style="background:${expColor(days/864e5)}">${days<864e5?t('today'):days<2*864e5?t('tomorrow'):Math.ceil(days/864e5)+t('dayUnit')}</i>`:'';
  const iconFile=brandIcon(q);
  const logo=iconFile
    ?`<div class="q2logo" style="--h:${hue}">${esc(initial)}<img src="${esc(iconFile.replace(/^\//,''))}" onerror="this.remove()">${badge}</div>`
    :`<div class="q2logo" style="--h:${hue}">${esc(initial)}${badge}</div>`;
  const err=q.error?`<div class="q2err">${esc(q.error)}</div>`:'';
  const rows=[];
  if(expWin){
    const rem=winRemain(expWin);
    const pct=usedPct(expWin); // used 是 0–100 百分比的窗口（书生 5 小时额度、MonkeyCode）
    const val=rem!=null?(t('remPre')+fmt(rem)+(expWin.limit?(t('ofTotal')+fmt(expWin.limit)):'')+t('remSuf'))
      :(/欠费/.test(expWin.display||'')?esc(expWin.display)
      :(expWin.text?(t('remPre')+fmt(dispNum(expWin)||0)+t('remSuf'))
      :(expWin.remaining!=null?(expWin.limit&&!/usd|美元|\$/i.test(expWin.unit||'')?(t('remPre')+fmt(expWin.limit*expWin.remaining/100)+t('ofTotal')+fmt(expWin.limit)+t('remSuf')):(t('remPre')+Math.round(expWin.remaining)+'%'+t('remSuf')))
      :(expWin.balance!=null?(t('remPre')+fmt(expWin.balance)+t('remSuf'))
      :(pct!=null?(t('remainPct')+(100-pct)+'%'+t('remSuf'))
      :(expWin.display?esc(expWin.display):'—'))))));
    const left=(expT-Date.now())/864e5;
    // 进度条画「剩余份额」：runsOut/limit、remaining/100，百分比窗口（MonkeyCode 等）
    // 剩余 = limit×(100-used)/100 → frac = 剩余/limit = (100-used)/100。
    // 不能用 used/100：那是「已用份额」，画出来会"剩一点"的错觉（used=0 时条只剩 2% 宽）。
    // used 百分比不需要 limit 就能画份额（书生端砚「5 小时额度」只有 used+resetsAt）。
    // 美元额度（$/¥）不画：那是账单不是额度池，100% 蓝条会误导。
    const usdWin=/usd|美元|\$/i.test(expWin.unit||'');
    const frac=usdWin?null
      :(expWin.runsOut!=null&&expWin.limit)?expWin.runsOut/expWin.limit
      :(expWin.remaining!=null?expWin.remaining/100
      :(pct!=null?(100-pct)/100:null));
    // 窗口本身就叫「总积分」时，第一行讲剩余、第二行讲总量，避免两个同名标签（比较对象是上游中文名，走 T.zh）
    const expLabel=(expWin.name===T.zh.winTotalPoints)?t('winRemPoints'):expWin.name;
    const bar1=frac!=null?`<div class="q2bar"><i style="width:${Math.max(2,Math.min(100,frac*100)).toFixed(1)}%;background:${expColor(days/864e5)}"></i></div>`:'';
    rows.push(`<div class="q2row"><span class="q2label" title="${esc(expWin.name)}">${esc(expLabel)}</span><span class="q2val">${val}</span><span class="q2exp" style="color:${expColor(left)}${left<=7?';font-weight:600':''}">${fmtDaysLeft(expT)}</span></div>`
      +bar1);
  }
  if(tot){
    // allText（各池只剩余额文本，宿主剥了结构）→ 标签写「积分余额」：这些数字相加是
    // 余额合计，不是真实上限，「总积分」会撒谎
    rows.push(`<div class="q2row"><span class="q2label">${t(tot.allText?'pointsBalance':'winTotalPoints')}</span><span class="q2val">${fmtPts(tot.n)}</span><span class="q2exp">${esc(tot.u)}${tot.exp&&(!expWin||Math.abs(tot.exp-expT)>6e4)?(' · '+fmtDaysLeft(tot.exp)):''}</span></div>`);
    if(sp){
      // 可用（长期+临时剩余）与已消耗两段；两者相加=发放总量
      const avail=sp.perm+sp.tempR, all=avail+sp.used;
      const w2=x=>Math.max(0,100*x/all).toFixed(1);
      const seg=[`<i style="width:${w2(avail)}%;background:#4da3ff"></i>`];
      if(sp.used>0)seg.push(`<i style="width:${w2(sp.used)}%;background:rgba(255,255,255,.18)"></i>`);
      rows.push(`<div class="q2bar q2seg" title="${t('avail')} ${fmtPts(avail)}${t('lparen')}${t('perm')} ${fmtPts(sp.perm)} + ${t('tempRem')} ${fmtPts(sp.tempR)}${t('rparen')} · ${t('tempUsed')} ${fmtPts(sp.used)}">${seg.join('')}</div>`);
    }else{
      const p2=poolSplit(expWin);
      if(p2)rows.push(segBar(expWin.name,p2.rem,p2.used));
      else{
        // 余额型窗口（balance/display 余额，无 limit）配「已用」文本窗口 → 已用/(已用+余额) 分段条
        // （meoo：余额 6,106 + 「已用」894 → 12.8%）。无已用窗口时无分母，不画。
        // expWin 可能为 null（tot 有值但没有任何窗口能算到期——soonWin 返回 [null,Infinity]）：
        // 此时没有可配对的窗口，只保留上面那行总积分/积分余额（绝不能删它——删了 rows
        // 会掉进 noWindows 兜底，MonkeyCode 这类 balance-only 卡就整卡变「无窗口数据」）。
        if(expWin){
          const rem=winRemain(expWin);
          if(rem!=null){
            const usedWin=wins.find(w=>w!==expWin&&/^已用|used/i.test(w.name||'')&&dispNum(w)!=null);
            if(usedWin)rows.push(segBar(expWin.name,rem,dispNum(usedWin)));
          }
        }
      }
    }
    // 没有积分分段条时，把容量最大的那个池子也画一条（SenseNova 的本周额度这类）
    if(!sp){
      let bw=null;
      for(const w of wins){
        if(w===expWin||w.limit==null)continue;
        if(expWin&&expWin.limit!=null&&w.limit<=expWin.limit)continue;
        if(winRemain(w)==null&&w.remaining==null&&winUsed(w)==null)continue;
        if(!bw||w.limit>bw.limit)bw=w;
      }
      if(bw){
        const rem2=winRemain(bw);
        // 同样画「剩余份额」：rem2/limit；百分比窗口（无 remaining）画 (100-used)/100
        const frac2=(rem2!=null&&bw.limit)?rem2/bw.limit:(bw.remaining!=null?bw.remaining/100:(usedPct(bw)!=null?(100-usedPct(bw))/100:null));
        const e2=winExp(bw), d2=e2!=null?(e2-Date.now())/864e5:null;
        const right2=d2!=null?fmtDaysLeft(e2):(bw.unit?esc(bw.unit):'');
        rows.push(`<div class="q2row"><span class="q2label" title="${esc(bw.name)}">${esc(bw.name)}</span><span class="q2val">${rem2!=null?(t('remPre')+fmt(rem2)+(bw.limit?(t('ofTotal')+fmt(bw.limit)):'')+t('remSuf')):'—'}</span><span class="q2exp"${d2!=null?` style="color:${expColor(d2)}${d2<=7?';font-weight:600':''}"`:''}>${right2}</span></div>`
          +(frac2!=null?`<div class="q2bar"><i style="width:${Math.max(2,Math.min(100,frac2*100)).toFixed(1)}%;background:${d2!=null?expColor(d2):'#4da3ff'}"></i></div>`:''));
      }
    }  }else if(totWin){
    const rem=winRemain(totWin);
    const val=rem!=null?fmt(rem):(totWin.remaining!=null?Math.round(totWin.remaining)+'%':esc(totWin.display||'—'));
    let right;
    if(/永久/.test(totWin.name||''))right=t('permRight');
    else if(rem!=null&&totWin.limit)right='/ '+fmt(totWin.limit);
    else if(totWin.remaining!=null&&totWin.limit)right=t('totalPre')+fmt(totWin.limit)+t('totalSuf');
    else right='';
    const frac=(totWin.runsOut!=null&&totWin.limit)?totWin.runsOut/totWin.limit:(totWin.remaining!=null?totWin.remaining/100:(usedPct(totWin)!=null?(100-usedPct(totWin))/100:null));
    rows.push(`<div class="q2row"><span class="q2label" title="${esc(totWin.name)}">${esc(totWin.name)}</span><span class="q2val">${val}</span><span class="q2exp">${right}</span></div>`
      +(frac!=null?`<div class="q2bar"><i style="width:${Math.max(2,Math.min(100,frac*100)).toFixed(1)}%"></i></div>`:''));
  }else if(!totWin&&!q.balance&&expWin&&expWin.limit){
    const p3=poolSplit(expWin);
    rows.push(`<div class="q2row"><span class="q2label">${t('totalQuota')}</span><span class="q2val">${t('totalPre')+fmt(expWin.limit)+t('totalSuf')}</span><span class="q2exp">${esc(expWin.unit||'')}</span></div>`
      +(p3?segBar(expWin.name,p3.rem,p3.used):''));
  }else if(q.balance){
    const m=String(q.balance).match(/^([\d,.]+)\s*(.*)$/);
    rows.push(`<div class="q2row"><span class="q2label">${t('pointsBalance')}</span><span class="q2val">${m?fmt(Number(m[1].replace(/,/g,''))):esc(q.balance)}</span><span class="q2exp">${m?esc(m[2]):''}</span></div>`);
  }
  if(!rows.length)rows.push('<div class="q2row"><span class="q2label">'+t('noWindows')+'</span></div>');
  const user=(q.user&&q.user!=='None'&&q.user!==nameStr)?`<span class="q2user" title="${esc(q.user)}">${esc(q.user)}</span>`:'';
  return `<div class="card q2card">${logo}<div class="q2body">
    <div class="q2head"><span class="q2name" title="${esc(nameStr)}">${esc(nameStr)}</span>${user}</div>
    ${err}${rows.join('')}</div></div>`;
}

function countdown(iso){
  if(!iso)return'';
  const ms=new Date(iso)-Date.now();
  if(ms<=0)return t('resetDone');
  const h=Math.floor(ms/36e5),m=Math.floor(ms%36e5/6e4);
  return h>=24?Math.floor(h/24)+t('dayUnit')+h%24+t('hrUnit'):h+t('hrUnit')+m+t('minUnit');
}

let gwLimit=null; // 最近一次 /v1/magpie/limit：网关短暂缺席时沿用旧值；此前未声明，首绘读到未定义标识符 → 「渲染失败: gwLimit is not defined」红条闪现
let lastQuotas=[], lastQuotaLimit=null; // 归因晚到时会重画卡片，需要留住最近一次额度列表
// 远端 provider（quota 卡上的 magpie-direct/duanyan 这类）的图标由服务端从本机
// icons/ 缓存拼成 data URI，随归属接口一起回来；只补缺、不覆盖本地已有的品牌映射。
function applyRemoteIcons(d,redraw){
  if(!d||!d.icons)return;
  window.QLOGOS=window.QLOGOS||{};
  let changed=false;
  for(const k of Object.keys(d.icons)){
    const v=d.icons[k];
    if(v&&!window.QLOGOS[k]){window.QLOGOS[k]=v;changed=true;}
  }
  if(changed&&redraw!==false&&lastQuotas.length)renderQuotas(lastQuotas,lastQuotaLimit);
}
function renderQuotas(list,limitInfo){
  lastQuotas=list||[]; lastQuotaLimit=limitInfo||null;
  gwLimit=limitInfo||gwLimit||null;
  // 同一订阅会因「直连/代理两条线路」和「本地/VPS 两个实例」出多张卡：
  // 按（归一化订阅 + 账号）分组，每组只留一张卡——同一上游额度池没必要显示两遍；
  // 双账号（不同 user/key）是真实的不同额度，照常分开。
  const groups=new Map();
  for(const q of (list||[])){
    const key=normSub(q.provider)+'\0'+(q.user||'');
    let g=groups.get(key); if(!g){g=[];groups.set(key,g);}
    g.push(q);
  }
  const pref=q=>((q.error?1:0)<<1)|(String(q.provider||'').startsWith('magpie-')?1:0);
  const arr=[];
  for(const g of groups.values()){
    g.sort((a,b)=>pref(a)-pref(b));
    g.forEach(q=>{if(q.name)q.name=String(q.name).replace(/ · Magpie (直连|代理)\s*$/,'');});
    arr.push(g[0]);
  }
  // 排序=临期积分：每池取"最快过期窗口"的到期日，从快到慢；无任何到期信息的垫底。
  // 与卡片首行同一套 soonWin（跳过已用空的窗口），保证看到的日期和排位一致。
  const soonExp=q=>soonWin(quotaWins(q))[1];
  arr.sort((a,b)=>{
    const ta=soonExp(a),tb=soonExp(b);
    const fa=ta===Infinity,fb=tb===Infinity;
    if(fa&&fb)return (a.name||'').localeCompare(b.name||'');
    if(fa)return 1;
    if(fb)return -1;
    return (ta-tb)||(a.name||'').localeCompare(b.name||'');
  });
  $('#quotaGrid').innerHTML=arr.map(quotaCard).join('')||'<div class="err">'+t('noQuotaData')+'</div>';
  // magpie 0.1.2981+ /v1/magpie/limit：caller key 被限（holds）时在段落标题旁亮提示
  const hl=gwLimit;

const prevK={};
// KPI 数值滚动：新旧都是有限数字才滚动（380ms ease-out），否则直接落值；尊重系统「减少动效」
function animNum(el,label,raw,f){
  const old=prevK[label];prevK[label]=raw;
  const put=()=>{el.textContent=f(raw);};
  if(typeof raw!=='number'||!isFinite(raw)||typeof old!=='number'||!isFinite(old)||raw===old
    ||matchMedia('(prefers-reduced-motion: reduce)').matches){put();return;}
  const t0=performance.now(),D=380;
  const step=t=>{const p=Math.min(1,(t-t0)/D),e=1-Math.pow(1-p,3);el.textContent=f(old+(raw-old)*e);if(p<1)requestAnimationFrame(step);};
  requestAnimationFrame(step);
}
let rotors=[];
// KPI 第三行竖向轮播（两段式）：旧段上滑淡出→新段下滑入，任一时刻只有一条完整可见；
// 单段静止；后台页签不空转。系统开了「减少动效」时内容照常轮换、只去掉滑动动画
// （部分手机浏览器/省电模式/防指纹设置会置位 reduced-motion——不滚动的症状即来自它）
function startRotors(){
  rotors.forEach(r=>clearInterval(r.t));rotors=[];
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  document.querySelectorAll('#kpis .roll').forEach(roll=>{
    if(roll.children.length<2)return;
    const segs=[...roll.children].map(x=>x.textContent);
    let i=0;
    rotors.push({t:setInterval(()=>{
      i=(i+1)%segs.length;
      const sp=roll.firstElementChild;
      if(!sp)return;
      if(reduce){sp.textContent=segs[i];return;}
      sp.style.transition='opacity .22s ease, transform .22s ease';
      sp.style.opacity='0';sp.style.transform='translateY(-0.5em)';
      setTimeout(()=>{
        if(!roll.isConnected)return;
        sp.textContent=segs[i];
        sp.style.transition='none';sp.style.transform='translateY(0.5em)';
        void sp.offsetHeight;
        sp.style.transition='opacity .25s ease, transform .25s ease';
        sp.style.opacity='1';sp.style.transform='translateY(0)';
      },230);
    },3000)});
  });
}

  const localDay=new Map(); // day -> Map(provider -> {calls,tok})，名字已按 MERGE 归并

      let pn;

  const direct=lastModels.filter(m=>!REMOTE_ENTRY.has(m.provider||'')).reduce((s,m)=>s+(m.calls||0),0);
  const data=[{name:t('flowDirect'),value:direct,itemStyle:{color:'#4da3ff'}}];
  const cb=(lastRemote&&lastRemote.callerBreakdown)||[];
  const mine=new Set(['cloud','Magpie']);
  let remote=0;
  for(const x of cb){ if(mine.has(x.name)) remote+=x.calls||0; }
  if(lastRemote) data.push({name:t('flowViaRemote'),value:remote,itemStyle:{color:'#bc8cff'}});
  if(!direct&&!lastRemote&&!cb.length){c.clear();cover('cFlow','<span>'+t('noData')+'</span>');return;}
  cover('cFlow',null);
  const total=(data.reduce((s2,x)=>s2+(x.value||0),0)||0)+cb.reduce((s2,x)=>s2+(mine.has(x.name)?0:(x.calls||0)),0)||1;
  const rest=[];
  for(const x of cb){
    if(mine.has(x.name)) continue;
    const item={name:t('flowOtherPre')+x.name,value:x.calls||0};
    // 「(无)」是没带 caller key 的内部流量，不值得单独成片（比较对象是上游数据值，走 T.zh）
    if(x.name!==T.zh.callerNone && item.value/total>=0.02) data.push(item); else rest.push(item);
  }
  if(rest.length){
    const sum=rest.reduce((s2,x)=>s2+x.value,0);
    if(sum>0) data.push({name:t('otherCallersPre')+rest.length+t('otherCallersSuf'),value:sum});
  }
  c.setOption({
    tooltip:{...TIP,trigger:'item',formatter:pp=>esc(pp.name)+': '+pp.value+t('timesUnit')+' ('+pp.percent+'%)'},
    legend:{bottom:0,left:'center',textStyle:{color:cssVar('--dim'),fontSize:11},type:'scroll'},
    series:[{type:'pie',radius:['40%','66%'],center:['50%','42%'],
      data:data.map((d,i)=>d.itemStyle?d:({...d,itemStyle:{color:PALETTE[i%PALETTE.length]}})),
      label:{show:true,position:'outside',color:cssVar('--txt'),fontWeight:600,
        textBorderColor:'transparent',textBorderWidth:0,shadowBlur:0,shadowColor:'transparent',
        formatter:pp=>pp.percent>=5?pp.name+' '+pp.percent.toFixed(0)+'%':''},
      labelLine:{length:8,length2:6},labelLayout:{hideOverlap:true},
      emphasis:{label:{show:true,formatter:pp=>pp.name+' '+pp.percent+'%',color:cssVar('--txt')}}}],
  },true);
}

function renderProv(models){
  lastModels=models||[];
  const agg=new Map();
  const push=(name,calls)=>{let a=agg.get(name); if(!a){a={calls:0};agg.set(name,a);} a.calls+=calls;};
  for(const m of lastModels){
    const p=m.provider||'other';
    if(REMOTE_ENTRY.has(p)&&(lastRemote||!remoteFailed)) continue;
    push(REMOTE_ENTRY.has(p)?(LINE_OF[p]?t(LINE_OF[p]):p):nameOf(p),m.calls||0);
  }
  // 有归因时按真实 provider 合并（本地直连与远端落地的同名 provider 加在一起）
  if(lastRemote) for(const rp of (lastRemote.providers||[])) push(nameOf(rp.provider),rp.calls||0);
  const arr=[...agg.entries()].map(([name,a])=>({name,value:a.calls})).sort((x,y)=>y.value-x.value);
  pieWithLegend('cProv',arr,x=>x.name);
}
function renderHeat(heat){
  const c=initChart('cHeat');
  heat=heat||[];
  if(!heat.length){c.clear();cover('cHeat','<span>'+t('noData')+'</span>');return;}
  cover('cHeat',null);
  const data=[];
  for(let d=0;d<7;d++)for(let h=0;h<24;h++)data.push([h,d,heat[d*24+h]||0]);
  const max=Math.max(1,...heat);
  c.setOption({
    tooltip:{...TIP,formatter:p=>(LANG==='zh'
      ?t('weekPre')+t('weekChars')[p.value[1]]
      :['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][p.value[1]])+' '+p.value[0]+':00 · '+p.value[2]+t('timesUnit')},
    grid:{left:44,right:16,top:8,bottom:52},
    xAxis:{type:'category',data:[...Array(24).keys()].map(h=>h+t('hourAxis')),axisLabel:{color:cssVar('--dim'),fontSize:11}},
    yAxis:{type:'category',data:['wd0','wd1','wd2','wd3','wd4','wd5','wd6'].map(t),axisLabel:{color:cssVar('--dim'),fontSize:11}},
    visualMap:{min:0,max,calculable:false,orient:'horizontal',left:'center',bottom:0,
      inRange:{color:[cssVar('--heat0'),'#1a3a6b','#2563c4','#4da3ff','#a5d8ff']},textStyle:{color:cssVar('--dim'),fontSize:11}},
    series:[{type:'heatmap',data,itemStyle:{borderColor:cssVar('--bg'),borderWidth:2,borderRadius:3},
      emphasis:{itemStyle:{shadowBlur:6,shadowColor:'rgba(0,0,0,.5)'}}}],
  },true);
}

function renderRecent(rows){
  $('#recentBody').innerHTML=(rows||[]).map(r=>{
    const ok=r.status===200;
    const retry=(r.tries||1)>1;
    const st=ok&&!retry?'ok':ok&&retry?'retry':'bad';
    const tm=r.t?r.t.slice(5,16).replace('T',' '):'';
    return `<tr><td>${esc(tm)}</td><td>${esc(r.agent||'')}</td><td>${esc(r.provider||'')}</td><td>${esc(r.model||'')}</td>
      <td class="num">${fmt(r.in)}</td><td class="num">${fmt(r.out)}</td><td class="num">${r.ttft!=null?(r.ttft/1000).toFixed(1)+t('secSp'):'—'}</td>
      <td class="num">${r.ms!=null?(r.ms/1000).toFixed(1)+t('secSp'):'—'}</td>
      <td><span class="st ${st}"></span>${esc(String(r.status))}${retry?t('retryPre')+esc(String(r.tries-1)):''}</td></tr>`;
  }).join('')||'<tr><td colspan="9" class="err">'+t('noRequests')+'</td></tr>';
}

// key 只由服务端注入 HTML（window.__KEY__），走 x-dash-key 请求头；?key= 已废除，
// 代理/访问日志/书签里都不再出现 key。static/ 资源免鉴权。
const PKEY=window.__KEY__||'';
const auth=(u)=>u;
const hf=()=>PKEY?{'x-dash-key':PKEY}:undefined;
// 部署时由 deploy.sh 注入 window.__BUILD__（时间+短哈希）；不常显，挂在「更新于」的悬浮提示里
if(window.__BUILD__){const up=document.getElementById('updated');if(up)up.title='build '+window.__BUILD__;}
// 页面级错误可见化：__errs 非空时红字显示在标题行（magpie webview 无 devtools 时的排障窗口），无错误时不占位
setInterval(function(){
  var bt=document.getElementById('buildTag');if(!bt)return;
  var e=window.__errs||[];
  var t=e.length?('⚠'+e.length+':'+String(e[e.length-1]).slice(0,120)):'';
  if(bt.dataset.err!==t){bt.dataset.err=t;bt.title=e.join(String.fromCharCode(10));bt.innerHTML=t?t.replace(/&/g,'&amp;').replace(/</g,'&lt;'):'';bt.style.display=t?'':'none';bt.style.color=t?'#f85149':'';}
},1500);

// 上游采集异常必须可见（静默显 0 会误导，data-semantics 红线）：首屏用 __NOTE__，刷新用响应里的 note。
// 幂等：无 note 移除横幅（恢复后降级提示不残留），note 变化时原位更新
function showNote(msg){
  let n=document.getElementById('noteBanner');
  if(!msg){ if(n)n.remove(); return; }
  if(!n){ n=document.createElement('div'); n.id='noteBanner'; n.className='err'; document.querySelector('.sub').after(n); }
  n.textContent='⚠ '+msg+t('noteTail');
}
function paint(d){
  showNote(window.__NOTE__);
  const u=d.usage||{};
  lastModels=u.models||[];
  renderKpis(u);
  renderDaily(d.detail||{});
  renderModels(u.models||[]);
  renderProv(u.models||[]);
  renderHeat((d.detail&&d.detail.heat)||[]);
  renderRecent((d.detail&&d.detail.recent)||[]);
  renderQuotas(d.quotas||[], d.limit);
  loadRemote(); // 归因到达后 renderRemote 会重画 daily/prov/flow/hourly；在此之前线路名不出现（见 remoteFailed）
  renderHourly();
  refreshQuotas(); // 首屏的 __DATA__.quotas 不含远端卡兜底，立刻补拉一次额度（含远端卡与图标）
  $('#updated').textContent=t('updatedAt')+new Date().toLocaleTimeString(LANG==='zh'?'zh-CN':'en-US',{hour12:false});
}

// 额度墙的增量刷新：/api/quotas 除网关卡外，remote 模式下还带本机服务补齐的远端卡与图标映射
async function refreshQuotas(){
  try{
    const q=await (await fetch(auth('api/quotas'),{headers:hf()})).json();
    if(q.error){ $('#quotaGrid').innerHTML='<div class="err">'+t('quotaApiErr')+esc(String(q.error).slice(0,80))+t('quotaApiErrTail')+'</div>'; return; }
    // 先合并图标再画，避免卡片先以首字色块出现、图标晚到又闪一次
    applyRemoteIcons(q,false);
    renderQuotas(q.data||[], q.limit);
  }catch(e){
    $('#quotaGrid').innerHTML='<div class="err">'+t('quotaLoadFail')+esc(e.message||e)+'</div>';
  }
}

async function load(){
  $('#updated').textContent=t('loading');
  // 首屏用服务端内联的 window.__DATA__（插件页在沙盒 frame 里，跨源 fetch 不可靠），
  // 刷新和切区间才走接口。
  const pre=window.__DATA__;
  if(pre){ window.__DATA__=null; try{ paint(pre); return; }catch(e){ $('#updated').innerHTML='<span style="color:var(--bad)">'+t('renderFail')+esc(e.message||e)+'</span>'; } }
  try{
    const r=await fetch(auth('api/overview?period='+period),{headers:hf()});
    if(r.status===401)throw new Error(t('needKey'));
    const jd=await r.json();
    if(jd.note)showNote(jd.note); // 网关异常时刷新路径也要可见，不能静默显 0
    const d=jd;
    if(d.error)throw new Error(typeof d.error==='string'?d.error:(d.error.message||JSON.stringify(d.error)));
    const u=d.usage;
    lastModels=u.models||[];
    renderKpis(u);
    renderDaily(d.detail);
    renderModels(u.models||[]);
    renderProv(u.models||[]);
    renderHeat(d.detail.heat||[]);
    renderRecent(d.detail.recent||[]);
    $('#updated').textContent=t('updatedAt')+new Date().toLocaleTimeString(LANG==='zh'?'zh-CN':'en-US',{hour12:false});
  }catch(e){
    $('#updated').innerHTML='<span style="color:var(--bad)">'+t('loadFail')+esc(e.message||e)+'</span>';
  }
  await refreshQuotas();
  loadRemote();
  renderHourly();
}

// period 按钮
for(const p of ['7d','30d','all']){
  const b=document.createElement('button');
  b.className='tbtn'+(p===period?' on':'');
  b.textContent=p;
  b.onclick=()=>{period=p;document.querySelectorAll('#periodBtns .tbtn').forEach(x=>x.classList.toggle('on',x.textContent===p));load();};
  $('#periodBtns').appendChild(b);
}
$('#refresh').onclick=load;
load();
setInterval(load,5*60*1000);
</script>
</body>
</html>

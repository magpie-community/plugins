<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="usage-tree-token" content="__USAGE_TREE_TOKEN__">
  <meta name="usage-tree-theme" content="__USAGE_TREE_THEME__">
  <meta name="usage-tree-lang" content="__USAGE_TREE_LANG__">
  <meta name="usage-tree-tokens" content="__USAGE_TREE_TOKENS__">
  <meta name="usage-tree-currency" content="__USAGE_TREE_CURRENCY__">
  <meta name="usage-tree-usd-cny" content="__USAGE_TREE_USD_CNY__">
  <title>__USAGE_TREE_TITLE__</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="view">
    <header class="head">
      <div class="head-text">
        <h1>账号用量</h1>
        <p>先看账号，再展开看它用过的模型</p>
      </div>
      <div class="head-tools">
        <div class="segs" id="period" role="group" aria-label="统计周期">
          <button type="button" data-period="today">今天</button>
          <button type="button" data-period="7d">7 天</button>
          <button type="button" data-period="30d">30 天</button>
          <button type="button" data-period="all">全部</button>
        </div>
        <button class="icon" id="refresh" type="button" aria-label="刷新用量" title="刷新用量">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1.02 6.74 2.74L21 8"/>
            <path d="M21 3v5h-5"/>
          </svg>
        </button>
      </div>
    </header>

    <section class="stats" id="summary" aria-label="用量汇总" aria-live="polite"></section>

    <section class="panel" aria-labelledby="ledger-title">
      <div class="panel-head">
        <h2 id="ledger-title">账号明细</h2>
        <div class="tools">
          <label class="search">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></svg>
            <input id="search" type="search" placeholder="搜索账号、供应商或模型" autocomplete="off">
          </label>
          <label class="sort">
            <span>排序</span>
            <select id="sort">
              <option value="tokens">按 Token</option>
              <option value="cost">按费用</option>
              <option value="calls">按调用</option>
              <option value="name">按名称</option>
            </select>
          </label>
          <button class="text" id="expand-all" type="button">展开全部</button>
        </div>
      </div>

      <div class="warn" id="warning" hidden></div>
      <div class="cols" aria-hidden="true">
        <span class="col-name">供应商 / 账号</span>
        <span>调用</span>
        <span class="col-tokens">Token</span>
        <span class="col-share">占比</span>
        <span>费用</span>
        <span>状态</span>
        <span></span>
      </div>
      <div class="accounts" id="accounts" aria-live="polite"></div>
      <div class="state" id="state-card" hidden></div>
    </section>

    <footer class="foot">
      <span id="source-note">数据由 Magpie 本地用量记录聚合</span>
      <span id="updated"></span>
    </footer>
  </main>

  <script src="view.js"></script>
  <script src="app.js"></script>
</body>
</html>

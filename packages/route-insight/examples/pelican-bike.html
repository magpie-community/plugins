<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>鹈鹕骑自行车 · 2D 动画</title>
<style>
  :root { --ink:#1d2b3a; --line:#2b3f55; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:#eaf3fb; }
  body { display:grid; place-items:center; font:14px/1.5 "Segoe UI", system-ui, sans-serif; color:#41586f; }
  .stage { width:min(96vw, 960px); }
  .frame { border-radius:16px; overflow:hidden; box-shadow:0 18px 50px rgba(29,43,58,.18); background:#fff; }
  svg { display:block; width:100%; height:auto; }
  .cap { display:flex; gap:10px; align-items:baseline; justify-content:space-between; padding:10px 4px 0; font-size:12.5px; }
  .cap b { color:#1d2b3a; font-weight:600; letter-spacing:.2px; }
  .cap span { opacity:.62; }

  /* ---- 动画：轮子、曲柄、身体、翅膀、眨眼、路面、云、鱼 ---- */
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
  @keyframes flap { 0%,100% { transform: rotate(-7deg); } 50% { transform: rotate(11deg); } }
  @keyframes blink { 0%,94%,100% { transform: scaleY(1); } 96% { transform: scaleY(.12); } }
  @keyframes road { to { stroke-dashoffset: -80; } }
  @keyframes drift { from { transform: translateX(0); } to { transform: translateX(940px); } }
  @keyframes pouch { 0%,100% { transform: rotate(0deg); } 50% { transform: rotate(-3deg); } }
  @keyframes fish { 0%,100% { transform: translateY(0) rotate(-8deg); } 50% { transform: translateY(-6px) rotate(6deg); } }
  @keyframes pedalA { 0%,100% { transform: rotate(-9deg); } 50% { transform: rotate(9deg); } }
  @keyframes pedalB { 0%,100% { transform: rotate(9deg); } 50% { transform: rotate(-9deg); } }

  .w-rear  { transform-origin: 250px 360px; animation: spin 1.05s linear infinite; }
  .w-front { transform-origin: 548px 360px; animation: spin 1.05s linear infinite; }
  .crank   { transform-origin: 400px 375px; animation: spin 1.05s linear infinite; }
  .rider   { animation: bob 1.05s ease-in-out infinite; }
  .wing    { transform-origin: 392px 228px; animation: flap .52s ease-in-out infinite; }
  .eye     { transform-origin: 489px 156px; animation: blink 4.4s ease-in-out infinite; }
  .pouch   { transform-origin: 505px 172px; animation: pouch 1.05s ease-in-out infinite; }
  .road    { animation: road .9s linear infinite; }
  .cloud-a { animation: drift 28s linear infinite; }
  .cloud-b { animation: drift 41s linear infinite; animation-delay: -12s; }
  .fish    { transform-origin: 584px 216px; animation: fish 1.7s ease-in-out infinite; }
  .leg-a   { transform-origin: 392px 300px; animation: pedalA 1.05s ease-in-out infinite; }
  .leg-b   { transform-origin: 382px 302px; animation: pedalB 1.05s ease-in-out infinite; }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; }
  }
</style>
</head>
<body>
<div class="stage">
  <div class="frame">
  <svg viewBox="0 0 800 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="一只鹈鹕骑着自行车，轮子在转，翅膀在扇">
    <defs>
      <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#dff0ff"/><stop offset="1" stop-color="#f6fbff"/>
      </linearGradient>
      <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#7b8aa0"/><stop offset="1" stop-color="#5b6a80"/>
      </linearGradient>
      <linearGradient id="body" x1="0" y1="0" x2="0.6" y2="1">
        <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#dfe7ef"/>
      </linearGradient>
      <linearGradient id="beak" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#ffc861"/><stop offset="1" stop-color="#f2a12b"/>
      </linearGradient>
      <radialGradient id="sun" cx=".5" cy=".5" r=".5">
        <stop offset="0" stop-color="#ffe9a8"/><stop offset=".62" stop-color="#ffd469" stop-opacity=".85"/><stop offset="1" stop-color="#ffd469" stop-opacity="0"/>
      </radialGradient>
    </defs>

    <!-- 背景 -->
    <rect width="800" height="480" fill="url(#sky)"/>
    <circle cx="676" cy="86" r="86" fill="url(#sun)"/>
    <circle cx="676" cy="86" r="34" fill="#ffe08a"/>
    <g fill="#ffffff" opacity=".92">
      <g class="cloud-a" transform="translate(-120,0)">
        <ellipse cx="150" cy="96" rx="52" ry="24"/><ellipse cx="192" cy="86" rx="36" ry="28"/><ellipse cx="112" cy="100" rx="30" ry="18"/>
      </g>
      <g class="cloud-b" transform="translate(-320,0)">
        <ellipse cx="430" cy="150" rx="58" ry="22"/><ellipse cx="472" cy="140" rx="34" ry="26"/>
      </g>
    </g>
    <!-- 远山 -->
    <path d="M0 392 L120 300 L210 372 L300 292 L420 392 Z" fill="#cfe0ee"/>
    <path d="M300 392 L430 316 L520 372 L610 300 L800 392 Z" fill="#c4d8e9"/>
    <!-- 草地 + 路面 -->
    <rect y="392" width="800" height="34" fill="#bfe0bd"/>
    <rect y="426" width="800" height="54" fill="url(#road)"/>
    <line class="road" x1="-40" y1="462" x2="860" y2="462" stroke="#f4f7fb" stroke-width="6" stroke-dasharray="34 46"/>

    <!-- 影子 -->
    <ellipse cx="400" cy="436" rx="208" ry="12" fill="#2b3f55" opacity=".16"/>

    <!-- 自行车 -->
    <g stroke-linecap="round">
      <!-- 后轮 -->
      <g class="w-rear">
        <circle cx="250" cy="360" r="72" fill="none" stroke="#22303f" stroke-width="8"/>
        <circle cx="250" cy="360" r="60" fill="none" stroke="#9fb0c2" stroke-width="2"/>
        <g stroke="#8fa2b6" stroke-width="2">
          <line x1="250" y1="292" x2="250" y2="428"/><line x1="186" y1="360" x2="314" y2="360"/>
          <line x1="205" y1="315" x2="295" y2="405"/><line x1="295" y1="315" x2="205" y2="405"/>
        </g>
        <circle cx="250" cy="360" r="7" fill="#22303f"/>
      </g>
      <!-- 前轮 -->
      <g class="w-front">
        <circle cx="548" cy="360" r="72" fill="none" stroke="#22303f" stroke-width="8"/>
        <circle cx="548" cy="360" r="60" fill="none" stroke="#9fb0c2" stroke-width="2"/>
        <g stroke="#8fa2b6" stroke-width="2">
          <line x1="548" y1="292" x2="548" y2="428"/><line x1="484" y1="360" x2="612" y2="360"/>
          <line x1="503" y1="315" x2="593" y2="405"/><line x1="593" y1="315" x2="503" y2="405"/>
        </g>
        <circle cx="548" cy="360" r="7" fill="#22303f"/>
      </g>

      <!-- 车架 -->
      <g fill="none" stroke="#1f8f8a" stroke-width="9">
        <line x1="250" y1="360" x2="400" y2="375"/>
        <line x1="400" y1="375" x2="368" y2="268"/>
        <line x1="368" y1="268" x2="512" y2="266"/>
        <line x1="512" y1="266" x2="400" y2="375"/>
        <line x1="250" y1="360" x2="368" y2="268"/>
      </g>
      <!-- 前叉 + 车把 -->
      <g fill="none" stroke="#1b7f7a" stroke-width="8">
        <line x1="512" y1="266" x2="548" y2="360"/>
        <line x1="512" y1="266" x2="524" y2="232"/>
      </g>
      <path d="M524 232 q-18 -16 -46 -6" fill="none" stroke="#22303f" stroke-width="8" stroke-linecap="round"/>
      <!-- 坐垫 -->
      <path d="M330 262 q26 -16 56 -2 q-20 16 -56 2 Z" fill="#22303f"/>
      <!-- 曲柄与踏板 -->
      <g class="crank">
        <line x1="400" y1="375" x2="400" y2="405" stroke="#4a5b70" stroke-width="7"/>
        <line x1="400" y1="375" x2="400" y2="345" stroke="#4a5b70" stroke-width="7"/>
        <rect x="384" y="400" width="32" height="9" rx="3" fill="#2c3b4d"/>
        <rect x="384" y="341" width="32" height="9" rx="3" fill="#2c3b4d"/>
      </g>
      <circle cx="400" cy="375" r="13" fill="none" stroke="#4a5b70" stroke-width="5"/>
      <circle cx="400" cy="375" r="4" fill="#22303f"/>

      <!-- 车筐 + 鱼 -->
      <g>
        <path d="M556 236 h56 l-8 46 h-40 Z" fill="#d9a76a" stroke="#b8863f" stroke-width="3"/>
        <g stroke="#b8863f" stroke-width="2">
          <line x1="562" y1="252" x2="606" y2="252"/><line x1="560" y1="266" x2="608" y2="266"/>
        </g>
        <g class="fish">
          <ellipse cx="584" cy="220" rx="24" ry="10" fill="#7fc4d8" stroke="#4397ae" stroke-width="2"/>
          <path d="M608 220 l14 -9 v18 Z" fill="#4397ae"/>
          <circle cx="568" cy="217" r="2.4" fill="#22303f"/>
        </g>
      </g>

      <!-- 鹈鹕 -->
      <g class="rider">
        <!-- 腿：一条踩下面的踏板、一条踩上面的，跟着曲柄蹬 -->
        <g class="leg-b">
          <path d="M382 302 C372 326 376 342 398 348" fill="none" stroke="#e79a35" stroke-width="10" stroke-linecap="round"/>
          <path d="M398 348 q14 2 18 8 q-16 6 -22 -2 Z" fill="#e79a35"/>
        </g>
        <g class="leg-a">
          <path d="M392 300 C400 330 402 362 402 392" fill="none" stroke="#f7bb63" stroke-width="10" stroke-linecap="round"/>
          <path d="M402 392 q16 2 20 9 q-18 6 -24 -2 Z" fill="#f7bb63"/>
        </g>
        <!-- 身体 -->
        <ellipse cx="390" cy="244" rx="86" ry="60" fill="url(#body)" stroke="#c7d3de" stroke-width="2"/>
        <path d="M312 224 q-34 -6 -52 18 q30 4 46 22 Z" fill="#e7eef5" stroke="#c7d3de" stroke-width="2"/>
        <!-- 翅膀 -->
        <ellipse class="wing" cx="388" cy="222" rx="64" ry="36" fill="#eef4f9" stroke="#a9bccd" stroke-width="3"/>
        <g class="wing" stroke="#bccbd9" stroke-width="2" fill="none">
          <path d="M346 226 q34 -14 72 -6"/>
          <path d="M350 240 q34 -12 66 -6"/>
        </g>
        <!-- 脖子 + 头 -->
        <path d="M436 214 q26 -26 44 -44" fill="none" stroke="#eef4f9" stroke-width="34" stroke-linecap="round"/>
        <path d="M436 214 q26 -26 44 -44" fill="none" stroke="#c7d3de" stroke-width="2" stroke-dasharray="0"/>
        <circle cx="478" cy="160" r="31" fill="#f7fafd" stroke="#c7d3de" stroke-width="2"/>
        <!-- 冠羽 -->
        <path d="M452 136 q-16 -16 -30 -12 q12 8 16 20 Z" fill="#e7eef5" stroke="#c7d3de" stroke-width="2"/>
        <!-- 大嘴：上喙 + 喉袋 -->
        <path d="M502 148 L612 166 L500 176 Z" fill="url(#beak)" stroke="#d8901f" stroke-width="2"/>
        <path class="pouch" d="M500 170 q52 46 112 -4 q-56 22 -112 4 Z" fill="#ffd07a" stroke="#d8901f" stroke-width="2"/>
        <line x1="504" y1="166" x2="606" y2="166" stroke="#d8901f" stroke-width="2"/>
        <!-- 眼睛 -->
        <g class="eye">
          <circle cx="489" cy="156" r="7" fill="#ffffff" stroke="#b9c6d3" stroke-width="1.5"/>
          <circle cx="490" cy="156" r="3.6" fill="#22303f"/>
          <circle cx="491.4" cy="154.4" r="1.2" fill="#ffffff"/>
        </g>
      </g>
    </g>
  </svg>
  </div>
  <div class="cap"><b>鹈鹕骑自行车</b><span>纯 SVG + CSS 动画 · 无脚本、无外部资源 · 轮子/曲柄/翅膀/眼睑/路面/云同步</span></div>
</div>
</body>
</html>

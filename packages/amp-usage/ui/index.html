<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="service-token" content="__SERVICE_TOKEN__" />
    <title>Amp usage</title>
    <link rel="stylesheet" href="style.css" />
    <script src="app.js" defer></script>
  </head>
  <body>
    <main>
      <header>
        <div id="periods" class="segmented" role="group">
          <button type="button" data-period="today" data-t="today"></button>
          <button type="button" data-period="24h" data-t="h24"></button>
          <button type="button" data-period="7d" data-t="d7"></button>
          <button type="button" data-period="30d" data-t="d30"></button>
          <button type="button" data-period="all" data-t="all"></button>
          <button type="button" data-period="custom">
            <svg viewBox="0 0 16 16" aria-hidden="true">
              <path
                d="M3 4.5h10v8.5H3zM3 7h10M5.5 2.5v3M10.5 2.5v3"
                fill="none"
                stroke="currentColor"
                stroke-width="1.3"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
            <span data-t="custom"></span>
          </button>
        </div>
        <div class="tools">
          <button id="refresh" class="icon" type="button" disabled>
            <svg viewBox="0 0 16 16" aria-hidden="true">
              <path
                d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9M13.5 2v3.4h-3.4"
                fill="none"
                stroke="currentColor"
                stroke-width="1.5"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </button>
          <select id="auto"></select>
        </div>
      </header>
      <div id="range" class="range" hidden>
        <input id="from" type="date" />
        <span class="muted">–</span>
        <input id="to" type="date" />
      </div>
      <div id="errors" class="card errors" role="alert" hidden></div>

      <p id="empty" class="muted" role="status" hidden></p>
      <div id="board" hidden>
        <dl id="tiles" class="tiles"></dl>

        <section id="chart" class="card">
          <div class="chart-head">
            <h2 id="chart-title"></h2>
            <span id="readout" class="muted"></span>
          </div>
          <div id="bars" class="bars"></div>
          <div class="axis muted">
            <span id="first-tick"></span><span id="last-tick"></span>
          </div>
        </section>

        <section class="card">
          <h2 data-t="byModel"></h2>
          <div class="scroll">
            <table>
              <thead>
                <tr>
                  <th data-t="model"></th>
                  <th data-t="calls"></th>
                  <th data-t="input"></th>
                  <th data-t="output"></th>
                  <th data-t="cacheRead"></th>
                  <th data-t="cacheWrite"></th>
                  <th data-t="share"></th>
                </tr>
              </thead>
              <tbody id="models"></tbody>
            </table>
          </div>
        </section>
      </div>

      <details id="issues-box" hidden>
        <summary id="issues-summary"></summary>
        <ul id="issues"></ul>
      </details>
      <details>
        <summary data-t="howTitle"></summary>
        <p data-t="how1"></p>
        <p data-t="how2"></p>
      </details>
      <footer class="muted">
        <span id="progress" role="status" aria-live="polite"></span>
        <span>Parser reference: Tokscale · MIT</span>
      </footer>
    </main>
  </body>
</html>

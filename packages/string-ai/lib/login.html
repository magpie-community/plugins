<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>登录 String AI · Magpie</title>
<style>
  :root{color-scheme:light dark;font:16px/1.6 system-ui,sans-serif;background:#19191c;color:#f4f4f5}
  body{margin:0;padding:48px 24px}main{max-width:390px;margin:8vh auto;background:#252529;border:1px solid #424248;border-radius:18px;padding:32px}
  h1{font-size:26px;margin:0 0 8px}p{color:#b5b5be}label{display:block;margin-top:18px}input,button{box-sizing:border-box;width:100%;font:inherit;border-radius:8px;padding:11px 14px}
  input{margin-top:6px;border:1px solid #60606a;background:#19191c;color:inherit}button{margin-top:24px;border:0;background:#b8beff;color:#171725;cursor:pointer;font-weight:600}
  button:disabled{opacity:.6;cursor:wait}#error{color:#ffb5b5}small{color:#b5b5be}[hidden]{display:none!important}a{color:#bdc3ff}
</style>
<main>
  <h1>登录 String AI</h1>
  <p id="description">登录后，Magpie 自动读取你已有的 API Key 和可用模型。</p>
  <form id="form">
    <div id="credentials">
      <label for="email">String AI 邮箱</label><input id="email" type="email" autocomplete="username" required>
      <label for="password">密码</label><input id="password" type="password" autocomplete="current-password" required>
    </div>
    <div id="verification" hidden>
      <label for="code">两步验证码</label><input id="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6">
    </div>
    <p id="error" role="alert"></p>
    <button id="submit" type="submit">登录并导入 API Key</button>
  </form>
  <p><small>这是 Magpie 插件在本机打开的登录页面。密码仅发送到 String AI，不写入插件配置。使用第三方登录的账号，请先在 <a href="https://www.string.ink/profile" target="_blank" rel="noreferrer">String AI 账号设置</a>中设置密码。</small></p>
</main>
<script>
  const state = location.hash.slice(1)
  history.replaceState(null, "", "/")
  const form = document.getElementById("form")
  const button = document.getElementById("submit")
  const error = document.getElementById("error")
  const password = document.getElementById("password")
  const code = document.getElementById("code")
  let requires2FA = false
  form.addEventListener("submit", async (event) => {
    event.preventDefault()
    button.disabled = true
    error.textContent = ""
    try {
      const input = requires2FA ? { code: code.value } : { email: document.getElementById("email").value, password: password.value }
      const response = await fetch("/login", { method: "POST", redirect: "error", headers: { "Content-Type": "application/json", "X-Login-State": state }, body: JSON.stringify(input) })
      const result = await response.json()
      if (!response.ok) throw new Error(result.error)
      if (result.requires2FA) {
        requires2FA = true
        password.value = ""
        password.required = false
        document.getElementById("email").required = false
        document.getElementById("credentials").hidden = true
        document.getElementById("verification").hidden = false
        code.required = true
        button.textContent = "验证并导入 API Key"
        code.focus()
      } else {
        form.reset()
        form.hidden = true
        document.getElementById("description").textContent = `已读取 ${result.keyCount} 个可用 API Key。请返回 Magpie，模型和余额会自动加载。`
      }
    } catch (failure) {
      error.textContent = failure.message
    } finally {
      button.disabled = false
    }
  })
</script>
</html>

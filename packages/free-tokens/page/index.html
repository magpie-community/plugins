<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Token 羊毛</title>
<link rel="stylesheet" href="style.css">
<script src="_magpie/bridge.js"></script>
<script src="view.js" defer></script>
<script src="app.js" defer></script>
</head>
<body>
  <header class="top">
    <div>
      <h1>Token 羊毛</h1>
      <p class="sub">看你的 magpie：哪些羊毛已能用、哪些差个插件、哪些还没插件 · 数据源 AIHOT</p>
    </div>
  </header>
  <p class="summary" id="summary"></p>
  <div class="tiles" id="buckets"></div>
  <p class="hint" id="tabhint"></p>
  <label class="find">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
    <input id="q" type="search" placeholder="在这一档里搜索厂商或羊毛…" autocomplete="off">
  </label>
  <div class="list" id="list"></div>
  <p class="empty" id="empty" style="display:none">这一档没有符合条件的羊毛</p>
  <p class="foot-note" id="footNote"></p>
  <div class="toast" id="toast"></div>
</body>
</html>

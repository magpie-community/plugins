<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" role="img" aria-label="fovea — keep the recent window sharp">
  <title>fovea banner</title>
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2f63a2" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#2f63a2" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1280" height="640" fill="#101821"/>
  <circle cx="640" cy="330" r="430" fill="url(#glow)"/>
  <!-- periphery: the same eye the logo draws, at banner scale -->
  <circle cx="640" cy="330" r="268" fill="none" stroke="#e8eef5" stroke-opacity="0.10" stroke-width="22"/>
  <circle cx="640" cy="330" r="196" fill="none" stroke="#e8eef5" stroke-opacity="0.22" stroke-width="26"/>
  <circle cx="640" cy="330" r="118" fill="none" stroke="#e8eef5" stroke-opacity="0.55" stroke-width="30"/>
  <circle cx="640" cy="330" r="46" fill="#7fb0e8"/>
  <!-- message strip: old context thinned, recent window whole -->
  <g fill="#e8eef5">
    <rect x="180" y="548" width="60" height="10" rx="5" opacity="0.28"/>
    <rect x="252" y="548" width="34" height="10" rx="5" opacity="0.28"/>
    <circle cx="304" cy="553" r="5" opacity="0.45"/>
    <circle cx="322" cy="553" r="5" opacity="0.45"/>
    <circle cx="340" cy="553" r="5" opacity="0.45"/>
    <rect x="360" y="548" width="34" height="10" rx="5" opacity="0.28"/>
    <rect x="432" y="548" width="230" height="10" rx="5" opacity="0.95"/>
  </g>
  <text x="640" y="150" text-anchor="middle" font-family="-apple-system, 'SF Pro Display', 'Segoe UI', sans-serif" font-size="118" font-weight="700" letter-spacing="-4" fill="#f2f6fa">fovea</text>
  <text x="640" y="205" text-anchor="middle" font-family="-apple-system, 'SF Pro Display', 'Segoe UI', sans-serif" font-size="27" font-weight="500" fill="#9fb4c8">keep the recent window sharp — thin everything before it</text>
</svg>

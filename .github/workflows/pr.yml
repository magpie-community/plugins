# Checks a pull request before it is merged: the tests publish.yml runs, and
# names any package new to npm (scripts/new-to-npm.sh). A new package
# doesn't hold the merge: magpie installs it from the dist branch.
name: pr

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: install dependencies
        run: bun install --ignore-scripts
      - name: test
        # the tests refuse a real home: no real sign-in is ever read
        run: HOME=$(mktemp -d) bun test
      - name: check
        run: bun scripts/check.mjs

  on-npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: packages new to npm
        run: scripts/new-to-npm.sh
